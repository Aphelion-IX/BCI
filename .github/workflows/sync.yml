name: BCI to Dynamics sync
on:
  schedule:
    - cron: "17 19 * * *"   # daily, ~05:17 Sydney (UTC+10)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no CRM writes)"
        type: boolean
        default: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m bci_sync.sync ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          BCI_CLIENT_ID: ${{ secrets.BCI_CLIENT_ID }}
          BCI_PASSWORD: ${{ secrets.BCI_PASSWORD }}
          DYNAMICS_ORG_URL: ${{ secrets.DYNAMICS_ORG_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
